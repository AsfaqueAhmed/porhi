services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pori_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pori_db}
    volumes:
      - pori_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pori_user} -d ${POSTGRES_DB:-pori_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-pori_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pori_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENABLE_TEST_OTP: ${ENABLE_TEST_OTP:-true}
      ADMIN_SEED_PHONE: ${ADMIN_SEED_PHONE:-01737740010}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - pori_uploads:/workspace/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://165-99-219-120.sslip.io/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pori_pgdata:
  pori_uploads:
