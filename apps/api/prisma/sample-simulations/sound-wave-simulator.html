      background: #fef2f2 !important;
      border-color: #fecaca !important;
      border-left: 4px solid #dc2626 !important;
      color: #991b1b !important;
    }

    .readout .formula-math {
      color: var(--pori-indigo-hover) !important;
      font-weight: 700 !important;
    }

    .readout p {
      color: #334155 !important;
    }

    .balance-item {
      background: #ffffff !important;
      border: 1px solid var(--pori-border-soft) !important;
      border-radius: 10px !important;
      color: var(--pori-heading) !important;
    }

    .warn {
      background: #fef2f2 !important;
      border: 1px solid #fecaca !important;
      border-left: 4px solid #dc2626 !important;
      border-radius: 10px !important;
      color: #991b1b !important;
    }

    .quiz-box {
      background: #fffbeb !important;
      border: 1px solid #fde68a !important;
      border-radius: 12px !important;
      color: #78350f !important;
      margin: 0 !important;
    }

    .quiz-prompt {
      color: #92400e !important;
    }

    .quiz-input {
      background: #ffffff !important;
      border: 1px solid var(--pori-border) !important;
      color: var(--pori-ink) !important;

    .eq-card {
      background: var(--pori-panel) !important;
      border: 1px solid var(--pori-border-soft) !important;
      border-left: 3px solid var(--pori-indigo) !important;
      color: var(--pori-heading) !important;
    }

    .eq-card b {
      color: var(--pori-indigo-hover) !important;
    }

    @media (max-width: 640px) {
      body { padding: 8px !important; }
      .container,
      .caliper-card { padding: 14px !important; border-radius: 14px !important; gap: 10px !important; }
      .controls,
      .control-panel { grid-template-columns: 1fr !important; padding: 12px !important; }
      .controls > .btn-row { grid-column: span 1 !important; }
      .grid,
      .calc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .charts-row,
      .eq-grid,
      .balance-box { grid-template-columns: 1fr !important; }
    }
    /* === END PORI UNIFIED SIMULATOR THEME === */

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow">🔬 ইন্টারেক্টিভ ল্যাব · SSC পদার্থবিজ্ঞান অধ্যায় ৭</div>
      <h1>শব্দ তরঙ্গ ও কম্পাঙ্ক সিমুলেটর</h1>
      <p>কম্পাঙ্ক (<i>f</i>) ও বিস্তার (<i>A</i>) পরিবর্তন করে তরঙ্গের রূপ ও শব্দ পরীক্ষা করুন</p>
    </header>

    <canvas id="waveCanvas"></canvas>

    <div class="controls">
      <div class="control-group">
        <label for="freq"><span>কম্পাঙ্ক (Frequency):</span> <span id="freqVal">250 Hz</span></label>
        <div class="slider-container">
          <input type="range" class="custom-range" id="freq" min="100" max="1000" step="10" value="250">
        </div>
        <div class="slider-indicator-wrap">
          <div class="slider-track-ticks">
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <div class="slider-indicator-dot" id="freqDot"></div>
          </div>
          <div class="slider-labels">
            <span>100 Hz</span>
            <span>550 Hz</span>
            <span>1000 Hz</span>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label for="amp"><span>বিস্তার (Amplitude):</span> <span id="ampVal">40</span></label>
        <div class="slider-container">
          <input type="range" class="custom-range" id="amp" min="10" max="70" step="1" value="40">
        </div>
        <div class="slider-indicator-wrap">
          <div class="slider-track-ticks">
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <div class="slider-indicator-dot" id="ampDot"></div>
          </div>
          <div class="slider-labels">
            <span>10</span>
            <span>40</span>
            <span>70</span>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label for="speed"><span>তরঙ্গ বেগ (Wave Speed):</span> <span id="speedVal">340 m/s</span></label>
        <div class="slider-container">
          <input type="range" class="custom-range" id="speed" min="100" max="600" step="20" value="340">
        </div>
        <div class="slider-indicator-wrap">
          <div class="slider-track-ticks">
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick"></span>
            <span class="slider-tick major"></span>
            <div class="slider-indicator-dot" id="speedDot"></div>
          </div>
          <div class="slider-labels">
            <span>100 m/s</span>
            <span>350 m/s</span>
            <span>600 m/s</span>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label><span>তরঙ্গদৈর্ঘ্য (λ = <i>v</i> / <i>f</i>):</span> <span id="lambdaVal">1.36 m</span></label>
        <div class="info-card">উচ্চ কম্পাঙ্কে তরঙ্গদৈর্ঘ্য ছোট হয় এবং তীক্ষ্ণতা বাড়ে</div>
      </div>
      <div class="btn-row">
        <button id="soundBtn">🔊 শব্দ শুনুন (Play Sound)</button>
        <button id="pauseBtn">⏸️ বিরতি (Pause Wave)</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    const freqInput = document.getElementById('freq');
    const ampInput = document.getElementById('amp');
    const speedInput = document.getElementById('speed');
    const freqVal = document.getElementById('freqVal');
    const ampVal = document.getElementById('ampVal');
    const speedVal = document.getElementById('speedVal');
    const lambdaVal = document.getElementById('lambdaVal');
    const soundBtn = document.getElementById('soundBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isPlayingAudio = false;
    let isPaused = false;
    let phase = 0;

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    function updateSliderFill(input, dotId) {
      const min = parseFloat(input.min) || 0;
      const max = parseFloat(input.max) || 100;
      const val = parseFloat(input.value) || 0;
      const pct = Math.max(0, Math.min(100, ((val - min) / (max - min)) * 100));
      input.style.setProperty('--fill-pct', pct + '%');
      const dot = document.getElementById(dotId);
      if (dot) dot.style.left = pct + '%';
    }

    function updateAllSliderFills() {
      updateSliderFill(freqInput, 'freqDot');
      updateSliderFill(ampInput, 'ampDot');
      updateSliderFill(speedInput, 'speedDot');
    }

    function updateLabels() {
      const f = parseFloat(freqInput.value);
      const a = parseFloat(ampInput.value);
      const v = parseFloat(speedInput.value);
      freqVal.textContent = f + ' Hz';
      ampVal.textContent = a;
      speedVal.textContent = v + ' m/s';
      const lambda = (v / f).toFixed(2);
      lambdaVal.textContent = lambda + ' m';
      updateAllSliderFills();

      if (oscillator) {
        oscillator.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.05);
      }
    }

    freqInput.addEventListener('input', updateLabels);
    ampInput.addEventListener('input', updateLabels);
    speedInput.addEventListener('input', updateLabels);

    soundBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (!isPlayingAudio) {
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(parseFloat(freqInput.value), audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        isPlayingAudio = true;
        soundBtn.textContent = '🔇 শব্দ বন্ধ করুন (Stop Sound)';
        soundBtn.classList.add('active');
      } else {
        oscillator.stop();
        oscillator.disconnect();
        isPlayingAudio = false;
        soundBtn.textContent = '🔊 শব্দ শুনুন (Play Sound)';
        soundBtn.classList.remove('active');
      }
    });

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶️ চালু করুন (Resume Wave)' : '⏸️ বিরতি (Pause Wave)';
    });

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      // Centerline
      ctx.beginPath();
      ctx.strokeStyle = '#cbd5e1';
      ctx.setLineDash([4, 4]);
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      const f = parseFloat(freqInput.value);
      const amp = parseFloat(ampInput.value);
      const v = parseFloat(speedInput.value);
      const waveLengthPx = (v / f) * 120;

      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#4f46e5';

      for (let x = 0; x < width; x++) {
        const y = height / 2 + Math.sin((x / waveLengthPx) * Math.PI * 2 - phase) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      if (!isPaused) {
        phase += (f / 60) * 0.15;
      }
      requestAnimationFrame(draw);
    }
    updateAllSliderFills();
    requestAnimationFrame(draw);
  </script>

  <!-- PORI UNIFIED RANGE SYNC -->
  <script>
    (function () {
      function syncRangeFill(el) {
        if (!el || el.type !== 'range') return;
        var min = parseFloat(el.min);
        var max = parseFloat(el.max);
        var val = parseFloat(el.value);
        if (Number.isNaN(min)) min = 0;
        if (Number.isNaN(max)) max = 100;
        if (Number.isNaN(val)) val = min;
        var ratio = max === min ? 0 : (val - min) / (max - min);
        ratio = Math.max(0, Math.min(1, ratio));
        var pctStr = (ratio * 100).toFixed(2) + '%';
        el.style.setProperty('--p', ratio.toFixed(4));
        el.style.setProperty('--fill', pctStr);
        el.style.setProperty('--fill-pct', pctStr);
        var row = el.closest && el.closest('.pori-stepper-row');
        if (row) {
          var disabled = !!el.disabled;
          row.querySelectorAll('.pori-step-btn').forEach(function (b) {
            b.disabled = disabled;
          });
        }
      }
      window.syncPoriRange = syncRangeFill;

      function mountSteppers(el) {
        if (!el || el.type !== 'range' || el.dataset.poriStepperMounted === '1') return;
        el.dataset.poriStepperMounted = '1';
        var row = document.createElement('div');
        row.className = 'pori-stepper-row';
        el.parentNode.insertBefore(row, el);
        var minusBtn = document.createElement('button');
        minusBtn.type = 'button';
        minusBtn.className = 'pori-step-btn';
        minusBtn.setAttribute('aria-label', 'মান কমান');
        minusBtn.textContent = '−';
        var plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'pori-step-btn';
        plusBtn.setAttribute('aria-label', 'মান বাড়ান');
        plusBtn.textContent = '+';
        row.appendChild(minusBtn);
        row.appendChild(el);
        row.appendChild(plusBtn);

        function nudge(dir) {
          if (el.disabled) return;
          var min = parseFloat(el.min);
          var max = parseFloat(el.max);
          var step = parseFloat(el.step);
          if (Number.isNaN(min)) min = 0;
          if (Number.isNaN(max)) max = 100;
          if (Number.isNaN(step) || step <= 0) step = (max - min) / 50 || 1;
          var cur = parseFloat(el.value);
          if (Number.isNaN(cur)) cur = min;
          var decimals = (String(step).split('.')[1] || '').length;
          var next = Math.max(min, Math.min(max, +(cur + dir * step).toFixed(decimals + 2)));
          if (next !== cur) {
            el.value = next;
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
          }
        }

        minusBtn.addEventListener('click', function () { nudge(-1); });
        plusBtn.addEventListener('click', function () { nudge(1); });
        syncRangeFill(el);
      }

      function syncAllRanges() {
        document.querySelectorAll('input[type="range"]').forEach(function (el) {
          mountSteppers(el);
          syncRangeFill(el);
        });
      }

      var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
      if (desc && desc.get && desc.set) {
        Object.defineProperty(HTMLInputElement.prototype, 'value', {
          configurable: true,
          get: function () { return desc.get.call(this); },
          set: function (v) {
            desc.set.call(this, v);
            if (this.type === 'range') syncRangeFill(this);
          }
        });
      }

      document.addEventListener('input', function (e) {
        if (e.target && e.target.type === 'range') syncRangeFill(e.target);
      }, true);
      document.addEventListener('change', function (e) {
        if (e.target && e.target.type === 'range') syncRangeFill(e.target);
      }, true);
      document.addEventListener('click', function () {
        setTimeout(syncAllRanges, 0);
      }, true);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncAllRanges);
      } else {
        syncAllRanges();
      }
      setTimeout(syncAllRanges, 50);
    })();
  </script>
</body>
