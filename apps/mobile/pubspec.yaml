name: porhi
description: "porhi (পড়ি) — Bilingual Bangladesh Curriculum Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local shared packages
  common:
    path: packages/common
  network:
    path: packages/network

  # State management & architecture
  get: ^4.6.6
  intl: ^0.20.2
  equatable: ^2.0.7

  # Networking & storage
  dio: ^5.4.3+1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0

  # Auth
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0

  # Rich learning media & UI
  flutter_math_fork: ^0.7.3
  just_audio: ^0.9.46
  flutter_tts: ^4.2.2
  webview_flutter: ^4.11.0
  cached_network_image: ^3.4.1
  chewie: ^1.11.0
  video_player: ^2.9.5
  fl_chart: ^0.71.0

  # Notifications & sharing
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/audio/lesson-intro.wav
